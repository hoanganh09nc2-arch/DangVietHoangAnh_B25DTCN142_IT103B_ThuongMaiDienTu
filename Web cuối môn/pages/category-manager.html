<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quản lý danh mục</title>
  <link rel="stylesheet" href="../css/category-manager.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script>
    if (localStorage.getItem("isLoggedIn") !== "true") {
      window.location.href = "login.html";
    }
  </script>
</head>
<body>

  <div class="layout">

    <aside class="sidebar">
      <div class="sidebar__logo">
        <span class="logo-icon"><i class="fa-solid fa-fire"></i></span>
        <span class="logo-text">Ecommerce</span>
      </div>
      <nav class="sidebar__nav">
        <a href="../pages/statistical-manager.html" class="nav-item" id="statistical">
          <span class="nav-icon"><i class="fa-solid fa-house"></i></span> Thống kê
        </a>
        <a href="#" class="nav-item nav-item-active" id="category">
          <span class="nav-icon"><i class="fa-solid fa-camera"></i></span> Danh mục
        </a>
        <a href="../pages/product-manager.html" class="nav-item" id="product">
          <span class="nav-icon"><i class="fa-regular fa-folder"></i></span> Sản phẩm
        </a>
      </nav>
    </aside>

    <div class="main">

      <header class="topbar">
        <div class="topbar_right">
          <span class="topbar_bell"><img src="../assets/icons/Bell.png" alt=""></span>
          <img class="topbar_avatar" src="../assets/images/10d5c319419f2137bf8772f28aaf576b74a68518 (1).png" alt="avatar" />
        </div>
      </header>

      <div class="content">

        <div class="page-header">
          <h1 class="page-title">Danh mục</h1>
          <button class="btn-add" onclick="showAddModal()">Thêm mới danh mục</button>
        </div>

        <div class="filters">
          <select class="select-filter">
            <option value="">Tất cả</option>
            <option value="Đang hoạt động">Đang hoạt động</option>
            <option value="Ngừng hoạt động">Ngừng hoạt động</option>
          </select>
          <div class="search-wrap">
            <div class="search">
              <input type="text" class="search-input" placeholder="Tìm kiếm danh mục theo tên "/>
            </div>
            <div class="search-shape">
              <img src="../assets/icons/Shape.png" alt="">
            </div>
          </div>
        </div>

        <table class="table">
          <thead>
            <tr>
              <th>Mã danh mục <i class="fa-solid fa-arrow-down"></i></th>
              <th>Tên danh mục <i class="fa-solid fa-arrow-down"></i></th>
              <th>Trạng thái</th>
              <th>Chức năng</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>

        <div class="number-pages"></div>

      </div>
    </div>
  </div>

  <!-- Modal Thêm -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title">Thêm mới danh mục</h2>
        <button class="modal-close" onclick="closeAddModal()">✕</button>
      </div>

      <div class="modal-body">
        <label class="form-label">Mã danh mục <span class="required">*</span></label>
        <input type="text" class="form-input" placeholder="Nhập mã danh mục" />

        <label class="form-label">Tên danh mục <span class="required">*</span></label>
        <input type="text" class="form-input" placeholder="Nhập tên danh mục" />

        <label class="form-label">Trạng thái</label>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" name="statusAdd" value="active" checked /> Đang hoạt động
          </label>
          <label class="radio-label">
            <input type="radio" name="statusAdd" value="inactive" /> Ngừng hoạt động
          </label>
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn-cancel" onclick="closeAddModal()">Hủy</button>
        <button class="btn-submit" id="btnAddSubmit">Thêm</button>
      </div>
    </div>
  </div>

  <!-- Modal Cập nhật -->
<div class="modal-overlay-up" id="modalOverlay-up">
  <div class="modal">
    <div class="modal-header">
      <h2 class="modal-title">Cập nhật danh mục</h2>
      <button class="modal-close" onclick="closeEditModal()">✕</button>
    </div>

    <div class="modal-body">
      <label class="form-label">Mã danh mục <span class="required">*</span></label>
      <input type="text" id="idEdit" class="form-input" placeholder="Nhập mã danh mục" />

      <label class="form-label">Tên danh mục <span class="required">*</span></label>
      <input type="text" id="nameEdit" class="form-input" placeholder="Nhập tên danh mục" />

      <label class="form-label">Trạng thái</label>
      <div class="radio-group">
        <label class="radio-label">
          <input type="radio" name="statusEdit" value="active" /> Đang hoạt động
        </label>
        <label class="radio-label">
          <input type="radio" name="statusEdit" value="inactive" /> Ngừng hoạt động
        </label>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeEditModal()">Hủy</button>
      <button class="btn-submit" id="btnEditSubmit">Cập nhật</button>
    </div>
  </div>
</div>

  <script src="../js/category-manager.js"></script>
</body>
</html>
