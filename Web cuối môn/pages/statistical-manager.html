<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quản lý thống kê</title>
  <link rel="stylesheet" href="../css/statistical-manager.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <div class="layout">

        <aside class="sidebar">
            <div class="sidebar__logo">
                <span class="logo-icon"><i class="fa-solid fa-fire"></i></span>
                <span class="logo-text">Ecommerce</span>
            </div>
            <nav class="sidebar__nav">
                <a href="#" class="nav-item" id="statistical">
                <span class="nav-icon"><i class="fa-solid fa-house"></i></span> Thống kê
                </a>
                <a href="../pages/category-manager.html" class="nav-item nav-item--active" id="category">
                <span class="nav-icon"><i class="fa-solid fa-camera"></i></span> Danh mục
                </a>
                <a href="../pages/product-manager.html" class="nav-item" id="product">
                <span class="nav-icon"><i class="fa-regular fa-folder"></i></span> Sản phẩm
                </a>
            </nav>
        </aside>

        <div class="main">

            <header class="topbar">
                <div class="topbar_right">
                    <span class="topbar_bell"><img src="../assets/icons/Bell.png" alt="Thông báo"></span>
                    
                    <!-- Avatar với dropdown -->
                    <div class="avatar-wrapper">
                        <img id="avatarTrigger" 
                             class="topbar_avatar" 
                             src="../assets/images/10d5c319419f2137bf8772f28aaf576b74a68518 (1).png" 
                             alt="avatar" />
                        
                        <!-- Menu đăng xuất -->
                        <div id="logoutMenu" class="logout-menu">
                            <a href="#" id="btnLogout" class="logout-item">
                                <span class="logout-icon"><img src="../assets/icons/logout.png" alt=""></span>
                                Đăng xuất
                            </a>
                        </div>
                    </div>
                </div>
            </header>

            <div class="content">
                <div class="page-header">
                    <h1 class="page-title">Thống kê</h1>
                </div>
            </div>    
        </div>
    </div>

    <script src="../js/statistical-manager.js"></script>
</body>
</html>
