<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Đăng nhập</title>
  <link rel="stylesheet" href="../css/login.css"/>
</head>
<body>

  <div class="card">
    <h1 class="card__title">Đăng nhập</h1>
    <p class="card__subtitle">Đăng nhập tài khoản để sử dụng hệ thống quản lý.</p>

    <form id="login">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" />
        <span class="error-msg" id="emailErr"></span>
      </div>

      <div class="field">
        <label for="password">Mật khẩu</label>
        <input type="password" id="password" name="password" />
        <span class="error-msg" id="passwordErr"></span>
      </div>

      <div class="row-options">
        <label class="checkbox-wrap">
          <input type="checkbox" name="remember" />
          <span>Nhớ tài khoản</span>
        </label>
        <a href="#">Quên mật khẩu?</a>
      </div>

      <button type="submit" class="btn-submit">Đăng nhập</button>
    </form>

    <p class="card__footer">Bạn chưa có tài khoản? <a href="../pages/register.html">Đăng ký</a></p>
  </div>
  <div id="toast-message" class="toast">Đăng nhập thành công!</div>
  <script src="../js/login.js"></script>
</body>
</html>
